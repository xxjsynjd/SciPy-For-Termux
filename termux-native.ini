[binaries]
c = '/data/data/com.termux/files/usr/bin/clang'
cpp = '/data/data/com.termux/files/usr/bin/clang++'
fortran = '/data/data/com.termux/files/usr/bin/flang'
cython = '/data/data/com.termux/files/usr/bin/cython'

[built-in options]
c_link_args = ['-landroid-complex-math', '-lm']
cpp_link_args = ['-landroid-complex-math', '-lm']
fortran_link_args = ['-landroid-complex-math', '-lm']

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
